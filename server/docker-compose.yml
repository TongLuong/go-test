#version: '3.8'

name: gos

networks:
  gos-net:
    name: gos-net
    driver: bridge

services:
  gos-database:
    image: postgres:17.0
    container_name: gos-database
    environment:
      POSTGRES_USER: gos
      POSTGRES_DB: gos
      POSTGRES_PASSWORD: gos
    ports:
      - "5433:5433"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    command: "postgres -p 5433"
    networks:
      - gos-net

  gos-service:
    image: eclipse-temurin:17-jdk
    container_name: gos-service
    working_dir: /gos_service
    volumes:
      - ./gos:/gos_service
    command: sh -c "./mvnw wrapper:wrapper &&
      ./mvnw dependency:go-offline &&
      ./mvnw clean install &&
      java -jar /gos_service/target/*.jar"
    networks:
      - gos-net
    ports:
      - "4000:4000"